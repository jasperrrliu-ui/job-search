name: Job search

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,16,20 * * *"

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  poll-and-email:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: job-db-${{ github.run_id }}
          restore-keys: |
            job-db-

      - name: Poll jobs or create the first baseline
        shell: bash
        run: |
          if [ -f data/jobs.db ]; then
            python -m job_tracker poll
          else
            python -m job_tracker bootstrap
          fi

      - name: Send daily digest
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: jasperrrliu@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: jasperrrliu@gmail.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m job_tracker email --daily --force
          else
            python -m job_tracker email --daily
          fi

      - name: Save job database
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: job-db-${{ github.run_id }}
