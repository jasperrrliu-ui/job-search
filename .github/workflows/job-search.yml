name: Job search

on:
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send the daily digest after this manual poll"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 8 * * *"
      timezone: "America/New_York"
    - cron: "17 9 * * *"
      timezone: "America/New_York"
    - cron: "17 14 * * *"
      timezone: "America/New_York"
    - cron: "17 15 * * *"
      timezone: "America/New_York"

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  poll-and-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: job-db-${{ github.run_id }}
          restore-keys: |
            job-db-

      - name: Check whether this delivery slot is due
        id: delivery
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "17 8 * * *"|"17 9 * * *") slot=morning ;;
              *) slot=afternoon ;;
            esac
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            if [ ! -f data/jobs.db ] || python -m job_tracker due --delivery-slot "$slot"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Mark poll start for CareerGraph export
        if: steps.delivery.outputs.run == 'true'
        id: poll_clock
        shell: bash
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"

      - name: Poll jobs or create the first baseline
        if: steps.delivery.outputs.run == 'true'
        shell: bash
        run: |
          if [ -f data/jobs.db ]; then
            python -m job_tracker poll
          else
            python -m job_tracker bootstrap
          fi

      - name: Backfill current role and career-stage taxonomy
        if: steps.delivery.outputs.run == 'true' && hashFiles('data/jobs.db') != ''
        run: python -m job_tracker reevaluate

      - name: Save job database
        if: success() && steps.delivery.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: job-db-${{ github.run_id }}

      - name: Create complete CareerGraph export
        if: success() && steps.delivery.outputs.run == 'true'
        shell: bash
        run: |
          python -m job_tracker.careergraph_export \
            --db data/jobs.db --output-dir careergraph-export \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --poll-started-at "${{ steps.poll_clock.outputs.started_at }}"

      - name: Keep CareerGraph export as workflow artifact
        if: success() && steps.delivery.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: careergraph-export-${{ github.run_id }}-${{ github.run_attempt }}
          path: careergraph-export/exports/
          retention-days: 14

      - name: Authenticate to GCP for CareerGraph export
        if: success() && steps.delivery.outputs.run == 'true' && vars.CAREERGRAPH_EXPORT_ROOT != '' && vars.CAREERGRAPH_WIF_PROVIDER != '' && vars.CAREERGRAPH_EXPORT_SA != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.CAREERGRAPH_WIF_PROVIDER }}
          service_account: ${{ vars.CAREERGRAPH_EXPORT_SA }}

      - name: Install gcloud for CareerGraph export
        if: success() && steps.delivery.outputs.run == 'true' && vars.CAREERGRAPH_EXPORT_ROOT != '' && vars.CAREERGRAPH_WIF_PROVIDER != '' && vars.CAREERGRAPH_EXPORT_SA != ''
        uses: google-github-actions/setup-gcloud@v3

      - name: Publish CareerGraph export to GCS
        if: success() && steps.delivery.outputs.run == 'true' && vars.CAREERGRAPH_EXPORT_ROOT != '' && vars.CAREERGRAPH_WIF_PROVIDER != '' && vars.CAREERGRAPH_EXPORT_SA != ''
        shell: bash
        env:
          EXPORT_ROOT: ${{ vars.CAREERGRAPH_EXPORT_ROOT }}
        run: |
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          source="careergraph-export/exports"
          gcloud storage cp "$source/$run_id/jobs.jsonl.gz" "$EXPORT_ROOT/exports/$run_id/jobs.jsonl.gz"
          gcloud storage cp "$source/$run_id/manifest.json" "$EXPORT_ROOT/exports/$run_id/manifest.json"
          gcloud storage cp "$source/latest.json" "$EXPORT_ROOT/exports/latest.json"

      - name: Send daily digest
        if: steps.delivery.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_digest)
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: jasperrrliu@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: jasperrrliu@gmail.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m job_tracker email --daily --force
          else
            python -m job_tracker email --daily --delivery-slot "${{ steps.delivery.outputs.slot }}"
          fi

      - name: Publish tracker dashboard
        if: success() && hashFiles('data/jobs.db') != ''
        shell: bash
        run: |
          mkdir -p reports
          python -m job_tracker status --output reports/TRACKER_STATUS.md
          cat reports/TRACKER_STATUS.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/TRACKER_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update tracker dashboard [skip ci]"
            git push
          fi
