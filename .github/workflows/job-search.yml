name: Job search

on:
  workflow_dispatch:
    inputs:
      send_digest:
        description: "Send the daily digest after this manual poll"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 8 * * *"
      timezone: "America/New_York"
    - cron: "17 9 * * *"
      timezone: "America/New_York"
    - cron: "17 14 * * *"
      timezone: "America/New_York"
    - cron: "17 15 * * *"
      timezone: "America/New_York"

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  poll-and-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: job-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-db-

      - name: Check whether this delivery slot is due
        id: delivery
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "17 8 * * *"|"17 9 * * *") slot=morning ;;
              *) slot=afternoon ;;
            esac
            echo "slot=$slot" >> "$GITHUB_OUTPUT"
            if [ ! -f data/jobs.db ] || python -m job_tracker due --delivery-slot "$slot"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Record poll start time
        id: poll_clock
        if: steps.delivery.outputs.run == 'true'
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Poll jobs or create the first baseline
        id: poll
        if: steps.delivery.outputs.run == 'true'
        shell: bash
        run: |
          if [ -f data/jobs.db ]; then
            python -m job_tracker poll
          else
            python -m job_tracker bootstrap
          fi

      - name: Backfill current role and career-stage taxonomy
        if: steps.delivery.outputs.run == 'true' && hashFiles('data/jobs.db') != ''
        run: python -m job_tracker reevaluate

      - name: Send daily digest
        if: steps.delivery.outputs.run == 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_digest)
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: jasperrrliu@gmail.com
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: jasperrrliu@gmail.com
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m job_tracker email --daily --force
          else
            python -m job_tracker email --daily --delivery-slot "${{ steps.delivery.outputs.slot }}"
          fi

      - name: Save job database
        id: cache_save
        if: always() && steps.delivery.outputs.run == 'true' && steps.poll.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: job-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Export full CareerGraph snapshot
        id: careergraph_export
        if: always() && steps.cache_save.outcome == 'success' && steps.delivery.outputs.slot == 'afternoon'
        env:
          POLL_STARTED_AT: ${{ steps.poll_clock.outputs.started_at }}
        run: |
          run_id="tracker-$(TZ=America/New_York date +%F)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          python -m job_tracker.export \
            --db data/jobs.db \
            --output-dir outputs/careergraph \
            --run-id "$run_id" \
            --poll-started-at "$POLL_STARTED_AT"

      - name: Check GCP export configuration
        id: export_config
        if: always() && steps.careergraph_export.outcome == 'success'
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          EXPORT_SA: ${{ vars.GCP_TRACKER_EXPORT_SA }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::Set GCP_WIF_PROVIDER repository variable"; exit 1; }
          test -n "$EXPORT_SA" || { echo "::error::Set GCP_TRACKER_EXPORT_SA repository variable"; exit 1; }

      - name: Authenticate to GCP
        id: gcp_auth
        if: always() && steps.export_config.outcome == 'success'
        uses: google-github-actions/auth@v3
        with:
          project_id: ms3-run-513900
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TRACKER_EXPORT_SA }}

      - name: Set up gcloud
        id: gcloud_setup
        if: always() && steps.gcp_auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload CareerGraph snapshot
        if: always() && steps.gcloud_setup.outcome == 'success'
        env:
          RUN_ID: ${{ steps.careergraph_export.outputs.run_id }}
        run: |
          prefix="gs://ms3_data_ingestion/careergraph/exports"
          if gcloud storage ls "$prefix/$RUN_ID/manifest.json" >/dev/null 2>&1; then
            echo "Daily snapshot $RUN_ID already exists; skipping duplicate upload"
          else
            gcloud storage cp outputs/careergraph/jobs.jsonl.gz "$prefix/$RUN_ID/jobs.jsonl.gz"
            gcloud storage cp outputs/careergraph/manifest.json "$prefix/$RUN_ID/manifest.json"
          fi
          if ! gcloud storage cat "$prefix/latest.json" 2>/dev/null | grep -Fq "\"run_id\": \"$RUN_ID\""; then
            gcloud storage cp outputs/careergraph/latest.json "$prefix/latest.json"
          fi

      - name: Publish tracker dashboard
        if: always() && hashFiles('data/jobs.db') != '' && steps.poll.outcome != 'failure'
        shell: bash
        run: |
          mkdir -p reports
          python -m job_tracker status --output reports/TRACKER_STATUS.md
          cat reports/TRACKER_STATUS.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/TRACKER_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update tracker dashboard [skip ci]"
            git push
          fi
