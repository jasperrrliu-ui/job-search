name: Export latest database (read-only)

on:
  workflow_dispatch:
    inputs:
      upload_to_gcs:
        description: "Upload a CareerGraph snapshot to GCS from the cached database"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore latest job database cache
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: db-export-${{ github.run_id }}
          restore-keys: |
            job-db-

      - name: Build database summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          db_path = Path("data/jobs.db")
          if not db_path.exists():
              raise SystemExit("Latest job-db cache did not restore data/jobs.db")

          connection = sqlite3.connect(db_path)
          connection.row_factory = sqlite3.Row
          tables = [
              row[0]
              for row in connection.execute(
                  "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
              )
          ]
          summary = {
              "database_size_bytes": db_path.stat().st_size,
              "tables": tables,
              "row_counts": {
                  table: connection.execute(
                      f'SELECT COUNT(*) FROM "{table}"'
                  ).fetchone()[0]
                  for table in tables
              },
              "job_status": [
                  dict(row)
                  for row in connection.execute(
                      "SELECT status, COUNT(*) AS count FROM jobs GROUP BY status ORDER BY status"
                  ).fetchall()
              ],
              "evaluation_decisions": [
                  dict(row)
                  for row in connection.execute(
                      "SELECT decision, COUNT(*) AS count FROM evaluations GROUP BY decision ORDER BY decision"
                  ).fetchall()
              ],
              "job_time_range": dict(
                  zip(
                      ("first_seen_min", "last_seen_max"),
                      connection.execute(
                          "SELECT MIN(first_seen_at), MAX(last_seen_at) FROM jobs"
                      ).fetchone(),
                  )
              ),
          }
          Path("outputs").mkdir(exist_ok=True)
          Path("outputs/db-summary.json").write_text(
              json.dumps(summary, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, ensure_ascii=False))
          PY

      - name: Upload read-only database export
        uses: actions/upload-artifact@v4
        with:
          name: latest-job-db-read-only
          path: |
            data/jobs.db
            outputs/db-summary.json
          retention-days: 1

      - name: Build CareerGraph snapshot from cached database
        id: careergraph_export
        if: inputs.upload_to_gcs
        shell: bash
        run: |
          run_id="tracker-manual-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          poll_started_at=$(python - <<'PY'
          import sqlite3
          with sqlite3.connect("data/jobs.db") as db:
              value = db.execute("SELECT MAX(started_at) FROM poll_runs").fetchone()[0]
          if not value:
              raise SystemExit("No Tracker poll found in cached database")
          print(value)
          PY
          )
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          python -m job_tracker.export \
            --db data/jobs.db \
            --output-dir outputs/careergraph \
            --run-id "$run_id" \
            --poll-started-at "$poll_started_at"

      - name: Check GCP export configuration
        if: inputs.upload_to_gcs
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          EXPORT_SA: ${{ vars.GCP_TRACKER_EXPORT_SA }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "::error::Set GCP_WIF_PROVIDER repository variable"; exit 1; }
          test -n "$EXPORT_SA" || { echo "::error::Set GCP_TRACKER_EXPORT_SA repository variable"; exit 1; }

      - name: Authenticate to GCP
        if: inputs.upload_to_gcs
        uses: google-github-actions/auth@v3
        with:
          project_id: ms3-run-513900
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TRACKER_EXPORT_SA }}

      - name: Set up gcloud
        if: inputs.upload_to_gcs
        uses: google-github-actions/setup-gcloud@v3

      - name: Upload CareerGraph manual snapshot
        if: inputs.upload_to_gcs
        env:
          RUN_ID: ${{ steps.careergraph_export.outputs.run_id }}
        run: |
          prefix="gs://ms3_data_ingestion/careergraph/exports"
          gcloud storage cp outputs/careergraph/jobs.jsonl.gz "$prefix/$RUN_ID/jobs.jsonl.gz"
          gcloud storage cp outputs/careergraph/manifest.json "$prefix/$RUN_ID/manifest.json"
          gcloud storage cp outputs/careergraph/latest.json "$prefix/latest.json"
          echo "CareerGraph export: $prefix/$RUN_ID/"
